services:
  - type: web
    name: teamsync-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: TEAMSYNC_PORT
        value: 3001
      - key: TEAMSYNC_ALLOWED_ORIGINS
        sync: false
      - key: TEAMSYNC_PERSIST
        value: true
      - key: TEAMSYNC_USE_SQLITE
        value: true
      - key: TEAMSYNC_DATABASE_PATH
        value: /var/data/teamsync/teamsync.db
      - key: SESSION_SECRET
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: TEAMSYNC_APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: teamsync-db
          property: connectionString
      - key: EMAIL_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_DOMAIN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ERROR_REPORTING_URL
        sync: false
      - key: TEAMSYNC_BACKUP_KEEP
        value: 14
    disk:
      name: teamsync-data
      mountPath: /var/data/teamsync
      sizeGB: 1

databases:
  - name: teamsync-db
    plan: free
    region: oregon
    databaseName: teamsync
    user: teamsync

cron:
  - name: teamsync-backup
    schedule: "0 2 * * *"
    command: node server/backup.js